<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Neural</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
  }
  #brain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .ui {
    position: fixed;
    bottom: 30px;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }
  .title {
    color: #4da6ff;
    font-size: 1.2em;
    letter-spacing: 0.8em;
    text-shadow: 0 0 15px #4da6ff;
    margin-bottom: 15px;
    font-weight: 200;
  }
  #btnMic {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 1px solid #4da6ff;
    background: rgba(77, 166, 255, 0.05);
    color: #4da6ff;
    font-size: 1.5em;
    cursor: pointer;
    transition: all 0.3s;
  }
  #btnMic:hover { background: rgba(77, 166, 255, 0.2); box-shadow: 0 0 20px #4da6ff; }
  #btnMic.on { background: rgba(77, 166, 255, 0.3); box-shadow: 0 0 30px #4da6ff; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  #status {
    color: #2a6db5;
    font-size: 0.85em;
    letter-spacing: 0.2em;
    margin-top: 10px;
    min-height: 20px;
  }
</style>
</head>
<body>
<canvas id="brain"></canvas>
<div class="ui">
  <div class="title">JARVIS</div>
  <button id="btnMic">🎤</button>
  <div id="status">toque para falar</div>
</div>

<script>
const canvas = document.getElementById('brain');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

// Define a forma do cérebro usando uma função de densidade
// Retorna true se o ponto (x,y) normalizado está dentro da forma
function inBrain(nx, ny) {
  // Cabeça vista de perfil (lado esquerdo)
  // nx, ny em [-1, 1]
  const x = nx, y = ny;

  // Crânio (círculo principal)
  const skull = (x + 0.1) * (x + 0.1) + y * y < 0.55;

  // Testa/boca (protrusão à direita embaixo)
  const jaw = x > 0.2 && x < 0.7 && y > -0.1 && y < 0.5 && (x - 0.2) * (x - 0.2) + (y - 0.2) * (y - 0.2) < 0.25;

  // Pescoço
  const neck = x > -0.3 && x < 0.3 && y > 0.5 && y < 1.0;

  return skull || jaw || neck;
}

const N = 2500;
const particles = [];
let energy = 0.4;

// Gera partículas dentro da forma
let attempts = 0;
while (particles.length < N && attempts < N * 20) {
  attempts++;
  const nx = Math.random() * 2 - 1;
  const ny = Math.random() * 2 - 1;
  if (inBrain(nx, ny)) {
    particles.push({
      // Posição base (forma)
      bx: nx, by: ny,
      // Posição atual (com dispersão)
      x: nx, y: ny,
      // Dispersão aleatória
      ox: (Math.random() - 0.5) * 0.06,
      oy: (Math.random() - 0.5) * 0.06,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.8 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.5
    });
  }
}

const cx = canvas.width / 2;
const cy = canvas.height / 2;
const scale = Math.min(canvas.width, canvas.height) * 0.35;

function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const t = Date.now() / 1000;

  particles.forEach(p => {
    // Oscilação suave em torno da posição base
    const wave = Math.sin(t * p.speed + p.phase) * 0.015 * (0.5 + energy);

    const px = cx + (p.bx + p.ox + wave) * scale;
    const py = cy + (p.by + p.oy + wave * 0.7) * scale;

    // Algumas partículas se destacam quando há energia
    const boost = Math.random() < energy * 0.02 ? 2 : 1;

    ctx.fillStyle = `rgba(120, 180, 255, ${p.alpha * (0.5 + energy * 0.5)})`;
    ctx.beginPath();
    ctx.arc(px, py, p.size * boost, 0, Math.PI * 2);
    ctx.fill();
  });

  // Brilho sutil no centro
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 0.8);
  grad.addColorStop(0, `rgba(77, 140, 255, ${0.05 + energy * 0.08})`);
  grad.addColorStop(1, 'rgba(77, 140, 255, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(cx - scale, cy - scale, scale * 2, scale * 2);

  requestAnimationFrame(draw);
}
draw();

window.addEventListener('resize', () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});

// Voz
let ativo = false, stream = null, rec = null, chunks = [];
const btn = document.getElementById('btnMic');
const statusEl = document.getElementById('status');

btn.addEventListener('click', async () => {
  if (!ativo) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      ativo = true;
      btn.classList.add('on');
      statusEl.textContent = 'ouvindo...';
      energy = 0.9;
      loop();
    } catch { statusEl.textContent = 'microfone bloqueado'; }
  } else {
    ativo = false;
    btn.classList.remove('on');
    statusEl.textContent = 'toque para falar';
    energy = 0.4;
    if (stream) stream.getTracks().forEach(t => t.stop());
  }
});

function loop() {
  if (!ativo) return;
  chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = send;
  rec.start();
  setTimeout(() => { try { if (rec.state === 'recording') rec.stop(); } catch {} }, 5000);
}

function fallbackVoz(texto) {
  try {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.onend = () => {
      energy = 0.9;
      if (ativo) { statusEl.textContent = 'ouvindo...'; loop(); }
    };
    speechSynthesis.speak(u);
  } catch {
    energy = 0.9;
    if (ativo) { statusEl.textContent = 'ouvindo...'; loop(); }
  }
}

async function send() {
  if (!ativo) return;
  const blob = new Blob(chunks, { type: 'audio/webm' });
  if (blob.size < 15000) { loop(); return; }
  statusEl.textContent = 'processando...';
  energy = 0.6;
  try {
    const fd = new FormData();
    fd.append('audio', blob, 'a.webm');
    const r = await fetch('/api/transcribe', { method: 'POST', body: fd });
    const d = await r.json();
    const txt = (d.text || '').trim();
    if (!txt) { statusEl.textContent = 'ouvindo...'; energy = 0.9; loop(); return; }
    statusEl.textContent = 'Você: ' + txt;
    const r2 = await fetch('/api/muse-brain', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt })
    });
    const d2 = await r2.json();
    const resp = (d2.response || '').trim();
    if (resp) {
      statusEl.textContent = 'Jarvis: ' + resp;
      energy = 1.0;
      const tocar = (url) => {
        const au = new Audio(url);
        au.onended = () => {
          energy = 0.9;
          if (ativo) { statusEl.textContent = 'ouvindo...'; loop(); }
        };
        au.onerror = () => fallbackVoz(resp);
        au.play().catch(() => fallbackVoz(resp));
      };
      if (d2.audio_url) {
        tocar(d2.audio_url);
      } else {
        fallbackVoz(resp);
      }
    } else {
      statusEl.textContent = 'ouvindo...';
      energy = 0.9;
      loop();
    }
  } catch {
    statusEl.textContent = 'erro, tentando...';
    setTimeout(() => { if (ativo) { statusEl.textContent = 'ouvindo...'; energy = 0.9; loop(); } }, 2000);
  }
}
</script>
</body>
</html>
